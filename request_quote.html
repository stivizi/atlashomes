        body {

            position: relative; /* Needed for ::before positioning */
            overflow: auto; /* Allow scrolling if content exceeds viewport height */

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/contractors/request_quote.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1; /* Place behind content */
            filter: brightness(0.5); /* Optional: Darken background for readability */
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8); /* Optional: Add a semi-transparent background to the container */
            border-radius: 8px; /* Optional: Add rounded corners */
            text-align: center; /* Center text within the container */
            z-index: 1; /* Ensure content is above the background */
        }
        iframe {
            width: 100%;
            height: 600px; /* Adjust height as needed */
            border: none;
        }
    </style>
</head>
